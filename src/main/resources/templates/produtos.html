<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <nav class="barra-navegacao">
        <div class="botao-inicio">
            Início
        </div>
        <div class="botao-voltar">
            Voltar
        </div>
        <div class="titulo-pagina">
            Produtos
        </div>
    </nav>

    <section class="acoes-produto">

        <form class="filtro">

            <div class="titulo-acoes-produto">
                Buscar por produto
            </div>

            <label for="nomeProduto-filtro">
                Nome do produto:
            </label>

            <input
                type="text"
                id="nomeProduto-filtro"
                name="nomeProduto-filtro"
            >

        </form>

    </section>

    <table class="tabela-produtos">

        <thead>
            <tr>
                <th>Nome</th>
                <th>Preço</th>
            </tr>
        </thead>

        <tbody id="tabela-produtos">
            <tr>
                <td>Coxinha</td>
                <td>R$ 6,00</td>
            </tr>

            <tr>
                <td>Refrigerante</td>
                <td>R$ 5,00</td>
            </tr>

            <tr>
                <td>Pastel</td>
                <td>R$ 7,00</td>
            </tr>
        </tbody>

    </table>    

    
</body>
</html>
