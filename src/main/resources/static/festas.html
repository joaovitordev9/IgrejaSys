<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/festas.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/botao.css">

</head>

<body>
    <nav class="barra-navegacao">
        <div class="botao-inicio">
            Início
        </div>
        <div class="botao-voltar">
            Voltar
        </div>
        <h2 class="titulo-pagina">
            Festas
        </h2>

        <div class="botao-principal" id="btnNovaFesta">
            Nova Festa
        </div>
    </nav>

    <div class="corpo">
        <section class="acoes-tabela">
            <form class="filtro">
                <h2 class="titulo-acoes-tabela">
                    Buscar por festa
                </h2>
                <label for="nomeFestaFiltro">
                    Nome da festa:
                </label>
                <input type="text" id="nomeFestaFiltro" name="nomeFesta-filtro">
            </form>
        
        </section>
        <table class="tabela-festas">
            <thead>
                <tr>
                    <th class="coluna-acoes">Ações</th>
                    <th class="coluna-codigo">Código</th>
                    <th class="coluna-nome">Nome</th>
                    <th class="coluna-inicio">Início</th>
                    <th class="coluna-fim">Fim</th>
                </tr>
            </thead>
            <tbody id="tabelaFestas">

                <!-- <tr>
                    <td class="coluna-acoes">
                        <button class="btn-alterar" id="btnTabelaFestasAcessar" data-id="01">Acessar Festa</button>
                    </td>
                    <td class="coluna-codigo">01</td>
                    <td class="coluna-nome">Festa Nossa Senhora do Rosário</td>
                    <td class="coluna-inicio">04/09/2026</td>
                    <td class="coluna-fim">04/10/2026</td>
                </tr> -->
            </tbody>
        </table>
        <div class="modal" id="modalPrincipalFesta">
            <div class="modal-info" id="modalInfoFesta">
                <h2 id="modalInfoFestaTitulo"></h2>
                <label for="nomeFesta">Nome</label>
                <input type="text" id="nomeFesta">
                <label for="inicioFesta">Data de início</label>
                <input type="date" id="inicioFesta">
                <label for="fimFesta">Data de término</label>
                <input type="date" id="fimFesta">
                <div class="modal-acoes">
                    <button class="btn btn-cancelar" id="btnModalInfoFestaCancelar">Cancelar</button>
                    <button class="btn btn-criar" id="btnModalInfoFestaSalvar" data-acao="">Salvar</button>
                </div>
            </div>

            <div class="modal-excluir" id="modalProdutosExcluir">
                <h2>Excluir produto</h2>
                <p id="mensagemExclusao">
                    Tem certeza que deseja excluir este produto?
                </p>
                <div class="modal-acoes">
                    <button class="btn btn-cancelar" id="btnModalExcluirCancelar">
                        Cancelar
                    </button>
                    <button class="btn btn-excluir" id="btnModalExcluirConfirmar">
                        Excluir
                    </button>
                </div>
            </div>

            <div id="modalAcessarFesta" class="modal-acessar-festa">

                 <div class="modal-cabecalho">
                    <h2 id="tituloFesta">Menu da festa</h2>
                    <button id="btnFecharModal">×</button>
                </div>

                <div class="opcoes-festa">

                    <button id="btnProdutos" class="btn-opcao-festa">
                        Produtos
                    </button>

                    <button id="btnCaixa" class="btn-opcao-festa">
                        Caixa
                    </button>

                    <button id="btnRelatorios" class="btn-opcao-festa">
                        Relatórios
                    </button>

                    <button id="btnAlterarFesta" class="btn-alterar">
                        Alterar
                    </button>

                    <button id="btnExcluir" class="btn-opcao-festa btn-excluir">
                        Excluir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/festas.js"></script>
</body>

</html>
