<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/festas.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/botao.css">

</head>

<body>
    <nav class="barra-navegacao">
        <div class="botao-inicio">
            Início
        </div>
        <div class="botao-voltar">
            Voltar
        </div>
        <h2 class="titulo-pagina">
            Festas
        </h2>

        <div class="botao-principal" id="btnNovaFesta">
            Nova Festa
        </div>
    </nav>


    <div class="corpo">
        <section class="acoes-tabela">
            <form class="filtro">
                <h2 class="titulo-acoes-tabela">
                    Buscar por festa
                </h2>
                <label for="nomeFesta-filtro">
                    Nome da festa:
                </label>
                <input type="text" id="nomeFesta-filtro" name="nomeFesta-filtro">
            </form>
        
        </section>
        <table class="tabela-festas">
            <thead>
                <tr>
                    <th class="coluna-acoes">Ações</th>
                    <th class="coluna-codigo">Código</th>
                    <th class="coluna-nome">Nome</th>
                    <th class="coluna-inicio">Início</th>
                    <th class="coluna-fim">Fim</th>
                    <th class="coluna-status">Status</th>
                </tr>
            </thead>
            <tbody id="tabelaFestas">

                <tr>
                    <td class="coluna-acoes">
                        <button class="btn-alterar" id="btnTabelaFestasAlterar" onclick="" data-id="01">Acessar Festa</button>
                    </td>
                    <td class="coluna-codigo">01</td>
                    <td>Festa Nossa Senhora do Rosário</td>
                    <td>04/09/2026</td>
                    <td>04/10/2026</td>
                    <td>Em andamento</td>
                </tr>
            </tbody>
        </table>
        <div class="modal" id="modalPrincipalFesta">
            <div class="modal-info-festa" id="modalInfoFesta">
                <h2 id="modalInfoFestaTitulo"></h2>
                <label for="nome">Nome</label>
                <input type="text" id="nomeProduto">
                <label for="preco">Preço</label>
                <input type="number" id="precoProduto">
                <div class="modal-acoes">
                    <button class="btn btn-cancelar" id="btnModalInfoProdutosCancelar">Cancelar</button>
                    <button class="btn btn-criar" id="btnModalInfoProdutosSalvar" data-acao="">Salvar</button>
                </div>
            </div>

            <div class="modal-excluir" id="modalProdutosExcluir">
                <h2>Excluir produto</h2>
                <p id="mensagemExclusao">
                    Tem certeza que deseja excluir este produto?
                </p>
                <div class="modal-acoes">
                    <button class="btn btn-cancelar" id="btnModalExcluirCancelar">
                        Cancelar
                    </button>
                    <button class="btn btn-excluir" id="btnModalExcluirConfirmar">
                        Excluir
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
