<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caixa</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/caixa.css">
    <link rel="stylesheet" href="css/botao.css">

</head>
<body>
<nav class="barra-navegacao">
    <div class="botao-inicio">
        Início
    </div>
    <div class="botao-voltar">
        Voltar
    </div>
    <h2 class="titulo-pagina">
        Caixa
    </h2>
</nav>
<div class="corpo">

    <div class="produtos">

        <h2 class="titulo-categoria">
            Comidas
        </h2>

        <div class="categoria"  id="categoria-comidas">


        </div>

        <h2 class="titulo-categoria" >
            Bebidas
        </h2>

        <div class="categoria" id="categoria-bebidas">



        </div>

    </div>

    <div class="pedido">

        <h2>Pedido Atual</h2>

        <div class="itens-pedido">

            <div class="item-pedido">

                <p>Pastel</p>

                <div class="controle-quantidade">
                    <button class="btn-quantidade">-</button>
                    <span class="quantidade">2</span>
                    <button class="btn-quantidade">+</button>
                </div>

            </div>

            <div class="item-pedido">

                <p>Coca-Cola</p>

                <div class="controle-quantidade">
                    <button class="btn-quantidade">-</button>
                    <span class="quantidade">1</span>
                    <button class="btn-quantidade">+</button>
                </div>

            </div>

        </div>

        <div class="total-pedido">
            <h3>Total: R$ 22,00</h3>
        </div>

        <div class="pagamento">

            <h3>Forma de pagamento</h3>

            <div class="opcoes-pagamento">

                <input type="radio" id="dinheiro" name="pagamento">
                <label for="dinheiro">Dinheiro</label>

                <input type="radio" id="pix" name="pagamento">
                <label for="pix">Pix</label>

                <input type="radio" id="cartao" name="pagamento">
                <label for="cartao">Cartão</label>

            </div>

            <div class="area-troco">

                <label for="valorRecebido">
                    Valor recebido
                </label>

                <input
                        type="number"
                        id="valorRecebido"
                        placeholder="0,00">

                <p class="troco">
                    Troco: R$ 0,00
                </p>

            </div>

        </div>

        <button class="btn btn-criar">
            Finalizar Pedido
        </button>

        <button class="btn btn-excluir">
            Cancelar
        </button>

    </div>

</div>



<script src="js/caixa.js"></script>
</body>
</html>
