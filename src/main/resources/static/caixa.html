<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Caixa</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/caixa.css">
    <link rel="stylesheet" href="css/botao.css">
</head>
<body>

<nav class="barra-navegacao">
    <div class="botao-inicio">
        Início
    </div>

    <div class="botao-voltar">
        Voltar
    </div>

    <h2 class="titulo-pagina">
        Caixa
    </h2>
</nav>

<div class="corpo">

    <!-- PRODUTOS -->
    <div class="produtos" id="area-categorias">

    </div>

    <!-- PEDIDO -->
    <div class="pedido">

        <h2>Pedido Atual</h2>

        <div id="itens-pedido" class="itens-pedido">

            <p>Nenhum item adicionado.</p>

        </div>

        <div class="total-pedido">
            <h3 id="total">
                Total: R$ 0,00
            </h3>
        </div>

        <div class="pagamento">

            <h3>Forma de pagamento</h3>

            <div class="opcoes-pagamento">

                <input
                        type="radio"
                        id="dinheiro"
                        name="pagamento"
                        value="DINHEIRO">

                <label for="dinheiro">
                    Dinheiro
                </label>

                <input
                        type="radio"
                        id="pix"
                        name="pagamento"
                        value="PIX">

                <label for="pix">
                    Pix
                </label>

                <input
                        type="radio"
                        id="cartao"
                        name="pagamento"
                        value="CARTAO">

                <label for="cartao">
                    Cartão
                </label>

            </div>

            <div id="area-troco" class="area-troco">

                <label for="valor-recebido">
                    Valor Recebido
                </label>

                <input
                        type="number"
                        id="valor-recebido"
                        step="0.01"
                        placeholder="0.00">

                <div id="troco" class="troco">

                </div>

            </div>

        </div>

        <button
                class="btn-finalizar"
                onclick="finalizarPedido()">

            Finalizar Pedido

        </button>

        <button
                class="btn btn-excluir"
                onclick="cancelarPedido()">

            Cancelar

        </button>

    </div>

</div>

<script src="js/caixa.js"></script>

</body>
</html>
