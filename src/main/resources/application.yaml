spring:
  application:
    name: Sys

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/igreja_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  address: 0.0.0.0
  port: 8080